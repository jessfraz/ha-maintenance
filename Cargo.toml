[package]
name = "home-maintenance"
version = "0.10.15"
edition = "2024"
license = "MIT"
description = "Local maintenance schedules and history for Home Assistant"
repository = "https://github.com/jessfraz/ha-maintenance"
default-run = "home-maintenance"

[dependencies]
ha-app-ui = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.8" }
anyhow = "1"
jiff = { version = "1", default-features = false, features = ["std"] }
# Keep the existing IANA 2025b calendar rules; update data as a separate behavior change.
jiff-tzdb = "=0.1.4"
time = { version = "0.3", features = ["large-dates"] }
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.18"
getrandom = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1.2", features = ["uuid1"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
# Temporary upstream pin until a registry release permits the SQLite advisory fix.
sqlx = { version = "0.9", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
ha-app-kit-ha = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.8" }
expectorate = "1"
tempfile = "3"
