name: Maintenance
version: "0.10.0"
slug: home_maintenance
description: Local maintenance schedules, completion history, and Home Assistant tasks
url: https://github.com/jessfraz/ha-maintenance
arch:
  - amd64
  - aarch64
image: ghcr.io/jessfraz/ha-maintenance
startup: application
boot: auto
backup: cold
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:wrench-clock
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Bearer-authenticated API for the integration and external clients
environment:
  MAINTENANCE_ENABLE_INGRESS: "true"
options: {}
schema: {}
discovery:
  - home_maintenance
