name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Reject private or generated data
        run: ./scripts/check-public-tree

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home-maintenance
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: home-maintenance/go.mod
          cache-dependency-path: home-maintenance/go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...
